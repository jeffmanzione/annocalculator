<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AnnoCalculator.com</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Put the chosen theme on the page before it is drawn, so that it does not flash in the other look.
      try {
        var theme = localStorage.getItem('ANNOCALCULATOR_THEME');
        if (theme === 'anno117') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Gelasio:wght@500;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>

  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
