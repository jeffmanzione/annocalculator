<h2 mat-dialog-title>
  <span textLoc="Manual JSON Input"></span>
</h2>
<mat-dialog-content class="mat-typography">
  <h3>
    Paste or edit the calculator input JSON here. Make sure your JSON is valid—invalid changes will be ignored. Use this
    feature to share, backup, or restore your calculator state.
  </h3>
  <json-input [(value)]="obj"></json-input>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <ac-button text="Cancel" mat-dialog-close></ac-button>
  <ac-button
    appearance="filled"
    color="primary"
    [mat-dialog-close]="obj()"
    text="Apply Changes"
    cdkFocusInitial></ac-button>
</mat-dialog-actions>
