<div class="tooltip-container">
  <div class="tooltip-inner-container">
    <img [src]="haciendaUrl" [alt]="value()" class="item-icon-big" />
    <div class="item-name">{{ value() }}</div>
    <div class="item-text extra-goods-container">
      <div class="extra-good">
        <img [src]="dungUrl" alt="Dung" class="good-icon-small" />
        <div class="extra-good-name">
          <span [textLoc]="dungName"></span>
          : 1 / 3
        </div>
      </div>
    </div>
  </div>
</div>
