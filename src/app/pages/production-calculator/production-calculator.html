@if (world) {
  <calculator-column
    class="column left-column"
    [actions]="defaultActions"
    [islands]="world.islands"
    [islandTemplate]="islandEditor"
    (addIsland)="addIsland()"
    (removeIsland)="removeIsland($event)">
    <div globalParameters [formGroup]="formGroup!">
      <enum-select
        class="palace-select"
        formControlName="palacePrestigeLevel"
        label="Palace Prestige Level"
        [options]="palacePrestigeLevels"
        [iconUrlLookupFn]="lookupPalaceIconUrl"
        [displayTextTransformer]="palaceLevelText"></enum-select>
    </div>
  </calculator-column>
  <div class="column right-column">
    <summary-panel [world]="worldSummary"></summary-panel>
    <trade-routes-panel [world]="world"></trade-routes-panel>
  </div>
}
<ng-template #islandEditor let-island>
  <island [controller]="island"></island>
</ng-template>
