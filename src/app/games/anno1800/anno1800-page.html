@if (world) {
  <mobile-section-tabs [(section)]="mobileSection"></mobile-section-tabs>
  <calculator-column
    class="column left-column"
    [class.mobile-hidden]="mobileSection() !== 'plan'"
    [actions]="defaultActions"
    [islands]="world.islands"
    [islandTemplate]="islandEditor"
    (addIsland)="addIsland()"
    (removeIsland)="removeIsland($event)">
    <div globalParameters [formGroup]="formGroup!">
      <enum-select
        class="palace-select"
        formControlName="palacePrestigeLevel"
        label="Palace Prestige Level"
        [options]="palacePrestigeLevels"
        [iconUrlLookupFn]="lookupPalaceIconUrl"
        [displayTextTransformer]="palaceLevelText"></enum-select>
    </div>
  </calculator-column>
  <div class="column right-column">
    <summary-panel [class.mobile-hidden]="mobileSection() !== 'summary'" [world]="worldSummary"></summary-panel>
    <trade-routes-panel [class.mobile-hidden]="mobileSection() !== 'trade'" [world]="world"></trade-routes-panel>
  </div>
}
<ng-template #islandEditor let-island>
  <anno-1800-island [controller]="island"></anno-1800-island>
</ng-template>
