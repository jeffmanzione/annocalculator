@if (controller()) {
  <ng-container [formGroup]="formGroup!">
    <island-editor (addLine)="addProductionLine()">
      <ng-container ngProjectAs="[settings]">
        <mat-form-field class="island-name-field">
          <mat-label textLoc="Island Name"></mat-label>
          <input matInput type="text" formControlName="name" aria-label="name" />
        </mat-form-field>
        <enum-select
          class="island-select"
          formControlName="region"
          label="Session"
          [options]="regions"
          [iconUrlLookupFn]="lookupRegionIconUrl"></enum-select>
        <enum-select
          class="island-select"
          formControlName="dolPolicy"
          label="Department Policy"
          [options]="dolPolicies()"
          [iconUrlLookupFn]="lookupPolicyIconUrl"></enum-select>
      </ng-container>

      <table mat-table class="production-lines-table" [dataSource]="productionLineRows()" multiTemplateDataRows>
        <ng-container matColumnDef="building">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Building"></span>
          </th>
          <td mat-cell *matCellDef="let element" [formGroup]="element.formGroup">
            <enum-select
              formControlName="building"
              [options]="productionBuildings()"
              [iconUrlLookupFn]="lookupBuildingIconUrl"
              [tooltip]="buildingTooltip"></enum-select>
          </td>
        </ng-container>
        <ng-container matColumnDef="numBuildings">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Count"></span>
          </th>
          <td mat-cell *matCellDef="let element" [formGroup]="element.formGroup" class="building-count">
            <span class="mobile-label" textLoc="Count"></span>
            <stepper-input formControlName="numBuildings" ariaLabel="numBuildings"></stepper-input>
          </td>
        </ng-container>
        <ng-container matColumnDef="expandExtraGoods">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Extras"></span>
          </th>
          <td mat-cell *matCellDef="let element" class="extra-goods-field">
            @if (element.hasExtraGoods()) {
              <span class="mobile-label" textLoc="Extras"></span>
              <ac-button
                [icon]="element.expandExtraGoodsIcon()"
                (action)="element.toggleShowExtraGoods(element)"></ac-button>
            }
          </td>
        </ng-container>
        <ng-container matColumnDef="inputGoods">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Inputs"></span>
          </th>
          <td mat-cell *matCellDef="let element" class="goods-field">
            <span class="mobile-label" textLoc="Inputs"></span>
            <enum-row
              [values]="element.inputGoodSources()"
              [iconUrlLookupFn]="lookupInputGoodIconUrl"
              [displayTextTransformer]="inputGoodName"
              [iconGlowFn]="isSubstitutedInput"
              [tooltip]="inputGoodTooltip"></enum-row>
          </td>
        </ng-container>
        <ng-container matColumnDef="good">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Output"></span>
          </th>
          <td mat-cell *matCellDef="let element" class="goods-field">
            <span class="mobile-label" textLoc="Output"></span>
            <enum-row
              [values]="element.outputGoods()"
              [iconUrlLookupFn]="lookupGoodIconUrl"
              [tooltip]="goodTooltip"></enum-row>
          </td>
        </ng-container>
        <ng-container matColumnDef="boosts">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Boosts"></span>
          </th>
          <td mat-cell *matCellDef="let element" [formGroup]="element.formGroup" class="boosts-field">
            <span class="mobile-label" textLoc="Boosts"></span>
            <enum-select
              formControlName="boosts"
              [options]="element.allowedBoosts()"
              [iconUrlLookupFn]="lookupBoostIconUrl"
              [multiple]="true"
              [tooltip]="boostTooltip"></enum-select>
          </td>
        </ng-container>
        <ng-container matColumnDef="hasTradeUnion">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Trade Union"></span>
          </th>
          <td mat-cell *matCellDef="let element" [formGroup]="element.formGroup" class="checkbox-field">
            <span class="mobile-label" textLoc="Trade Union"></span>
            <mat-checkbox formControlName="hasTradeUnion"></mat-checkbox>
          </td>
        </ng-container>
        <ng-container matColumnDef="items">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Items"></span>
          </th>
          <td mat-cell *matCellDef="let element" [formGroup]="element.formGroup">
            <span class="mobile-label" textLoc="Items"></span>
            <enum-select
              formControlName="items"
              [options]="element.allowedItems()"
              [iconUrlLookupFn]="lookupItemIconUrl"
              [multiple]="true"
              [multipleSelectLimit]="multipleSelectLimit"
              [tooltip]="itemTooltip"
              [valueIsExemptFromLimit]="isHarborItem"></enum-select>
          </td>
        </ng-container>
        <ng-container matColumnDef="culturalSets">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Cultural Sets"></span>
          </th>
          <td mat-cell *matCellDef="let element" [formGroup]="element.formGroup">
            <span class="mobile-label" textLoc="Cultural Sets"></span>
            <enum-select
              formControlName="culturalSets"
              [options]="element.allowedCulturalSets()"
              [iconUrlLookupFn]="lookupCulturalSetIconUrl"
              [multiple]="true"
              [tooltip]="culturalSetTooltip"
              [displayTextTransformer]="transformCulturalSetName"></enum-select>
          </td>
        </ng-container>
        <ng-container matColumnDef="inRangeOfLocalDepartment">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Local Dept"></span>
          </th>
          <td mat-cell *matCellDef="let element" [formGroup]="element.formGroup" class="checkbox-field">
            <span class="mobile-label" textLoc="Local Dept"></span>
            <mat-checkbox formControlName="inRangeOfLocalDepartment"></mat-checkbox>
          </td>
        </ng-container>
        <ng-container matColumnDef="inRangeOfHaciendaFertiliserWorks">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Fert Works"></span>
          </th>
          <td mat-cell *matCellDef="let element" [formGroup]="element.formGroup" class="checkbox-field">
            <span class="mobile-label" textLoc="Fert Works"></span>
            <mat-checkbox formControlName="inRangeOfHaciendaFertiliserWorks"></mat-checkbox>
          </td>
        </ng-container>
        <ng-container matColumnDef="efficiency">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Efficiency"></span>
          </th>
          <td mat-cell class="keep-top" *matCellDef="let element" class="computed-field">
            <span class="mobile-label" textLoc="Efficiency"></span>
            <composite-number
              [constituentValues]="element.efficiencyConstituents()"
              [showPlusIfPositive]="true"
              [isPercent]="true"></composite-number>
          </td>
        </ng-container>
        <ng-container matColumnDef="buildingProcessTimeSeconds">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Building Process Time"></span>
          </th>
          <td mat-cell class="keep-top" *matCellDef="let element" class="computed-field">
            <span class="mobile-label" textLoc="Building Process Time"></span>
            <formatted-number [value]="element.buildingProcessTimeSeconds()" suffix="s"></formatted-number>
          </td>
        </ng-container>
        <ng-container matColumnDef="goodsProducedPerMinute">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Goods per Minute"></span>
          </th>
          <td mat-cell class="keep-top" *matCellDef="let element" class="computed-field">
            <span class="mobile-label" textLoc="Goods per Minute"></span>
            <composite-number
              [constituentValues]="element.goodsProducedPerMinuteConstituents()"
              [showPlusIfPositive]="true"
              suffix="/m"></composite-number>
          </td>
        </ng-container>
        <ng-container matColumnDef="remove">
          <th mat-header-cell *matHeaderCellDef>
            <span textLoc="Remove"></span>
          </th>
          <td mat-cell *matCellDef="let element" [formGroup]="element.formGroup" class="remove-field">
            <ac-button icon="delete" (action)="removeProductionLine(element)"></ac-button>
          </td>
        </ng-container>
        <ng-container matColumnDef="extraGoods">
          <td mat-cell *matCellDef="let element" [attr.colspan]="productionLineColumns.length" class="extra-goods-row">
            @if (element.showExtraGoods()) {
              <extra-goods-table
                [rows]="element.extraGoodsRows()"
                [goodIcon]="lookupGoodIconUrl"
                [goodTooltip]="goodTooltip"
                [sourceIcon]="extraGoodSourceIcon"
                [sourceTooltip]="extraGoodSourceTooltip"></extra-goods-table>
            }
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="productionLineColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: productionLineColumns" class="production-line-row"></tr>
        <tr mat-row *matRowDef="let row; columns: ['extraGoods']" class="extra-good-table-row"></tr>
      </table>
    </island-editor>
  </ng-container>
}

<ng-template #goodTooltip let-value="value">
  <anno-1800-tooltip kind="good" [value]="value"></anno-1800-tooltip>
</ng-template>
<ng-template #inputGoodTooltip let-value="value">
  <anno-1800-tooltip kind="inputGood" [value]="value"></anno-1800-tooltip>
</ng-template>
<ng-template #haciendaTooltip let-value="value">
  <anno-1800-tooltip kind="hacienda" [value]="value"></anno-1800-tooltip>
</ng-template>
<ng-template #buildingTooltip let-value="value">
  <anno-1800-tooltip kind="building" [value]="value"></anno-1800-tooltip>
</ng-template>
<ng-template #boostTooltip let-value="value">
  <anno-1800-tooltip kind="boost" [value]="value"></anno-1800-tooltip>
</ng-template>
<ng-template #policyTooltip let-value="value">
  <anno-1800-tooltip kind="policy" [value]="value"></anno-1800-tooltip>
</ng-template>
<ng-template #itemTooltip let-value="value">
  <anno-1800-tooltip kind="item" [value]="value"></anno-1800-tooltip>
</ng-template>
<ng-template #culturalSetTooltip let-value="value">
  <anno-1800-tooltip kind="culturalSet" [value]="value"></anno-1800-tooltip>
</ng-template>
