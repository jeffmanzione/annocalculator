@if (wrapInMatFormField()) {
  <mat-form-field class="field">
    @if (label()) {
      <mat-label><span [textLoc]="label()!"></span></mat-label>
    }
    <mat-select
      [(value)]="value"
      [disabled]="isDisabled"
      (valueChange)="onChange(value)"
      (closed)="onTouched()"
      (openedChange)="onOpenedChange($event)"
      [multiple]="multiple()"
      [placeholder]="noneText()"
      [class.placeholder]="valueAsArray().length == 0">
      <mat-select-trigger>
        <enum-row
          [values]="valueAsArray()"
          [iconUrlLookupFn]="iconUrlLookupFn()"
          [tooltip]="tooltip()"
          [displayTextTransformer]="displayTextTransformer()"></enum-row>
      </mat-select-trigger>
      @for (option of options(); track option) {
        <mat-option
          [value]="option"
          [disabled]="
            multiple() &&
            valuesNotExemptFromLimit() >= multipleSelectLimit() &&
            !valueAsArray().includes(option) &&
            !valueIsExemptFromLimit()(option)
          ">
          <enum-row
            [values]="[option]"
            [iconUrlLookupFn]="iconUrlLookupFn()"
            [tooltip]="tooltip()"
            [displayTextTransformer]="displayTextTransformer()"></enum-row>
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
} @else {
  <mat-select
    [(value)]="value"
    [disabled]="isDisabled"
    (valueChange)="onChange(value)"
    (closed)="onTouched()"
    (openedChange)="onOpenedChange($event)"
    [multiple]="multiple()"
    [placeholder]="noneText()">
    <mat-select-trigger>
      <enum-row
        [values]="valueAsArray()"
        [iconUrlLookupFn]="iconUrlLookupFn()"
        [tooltip]="tooltip()"
        [displayTextTransformer]="displayTextTransformer()"></enum-row>
    </mat-select-trigger>
    @for (option of options(); track option) {
      <mat-option
        [value]="option"
        [disabled]="
          multiple() &&
          valueAsArray().length >= multipleSelectLimit() &&
          !valueAsArray().includes(option) &&
          !valueIsExemptFromLimit()(option)
        ">
        <enum-row
          [values]="[option]"
          [iconUrlLookupFn]="iconUrlLookupFn()"
          [tooltip]="tooltip()"
          [displayTextTransformer]="displayTextTransformer()"></enum-row>
      </mat-option>
    }
  </mat-select>
}
