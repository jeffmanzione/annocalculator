<div
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  (mouseenter)="showTooltipAt()"
  (mouseleave)="hideTooltipAt()"
  class="container">
  <formatted-number
    [value]="value()"
    [isPercent]="isPercent()"
    [format]="format()"
    [formatFontSpec]="formatFontSpec()"
    [suffix]="suffix()"
    [zeroOverride]="zeroOverride()"></formatted-number>
  <mat-icon>info_outlined</mat-icon>
</div>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="showTooltip"
  (detach)="hideTooltipAt()">
  <div class="tooltip-container">
    <div class="total">
      <formatted-number
        [value]="value()"
        [isPercent]="isPercent()"
        [format]="format()"
        [formatFontSpec]="formatFontSpec()"
        [suffix]="suffix()"
        [zeroOverride]="zeroOverride()"></formatted-number>
    </div>
    <table>
      @for (num of constituentValues(); track num) {
        <tr class="constituent">
          <td>
            <formatted-number
              class="vertically-center"
              [value]="num.value"
              [isPercent]="isPercent()"
              [format]="format()"
              [formatFontSpec]="formatFontSpec()"
              [suffix]="suffix()"
              [zeroOverride]="zeroOverride()"
              [showPlusIfPositive]="showPlusIfPositive()"></formatted-number>
          </td>
          <td class="vertically-center">&nbsp;-&nbsp;</td>
          <td>
            <div class="description-container vertically-center">
              @if (num.iconUrl) {
                <img [src]="num.iconUrl" alt="Icon" class="item-icon-small" />
              }
              <div class="description" [textLoc]="toLoc(num.description)"></div>
            </div>
          </td>
        </tr>
      }
    </table>
  </div>
</ng-template>
