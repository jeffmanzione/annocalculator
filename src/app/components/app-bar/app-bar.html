<mat-toolbar color="primary" class="toolbar">
  <div class="underlay"></div>
  <div class="toolbar-items">
    <button mat-button class="toolbar-title toolbar-text-shadow" (click)="navigateTo('/')">
      {{ website }}
    </button>
    <div class="toolbar-break toolbar-break-top"></div>
    @for (app of apps; track app) {
      <div class="toolbar-item toolbar-text-shadow" [ngClass]="isCurrentApp(app) ? 'toolbar-item-selected' : ''">
        <button mat-button [disabled]="isCurrentApp(app)" (click)="navigateTo(app)">
          <span [textLoc]="app.name!"></span>
        </button>
      </div>
    }
    <div class="toolbar-break toolbar-break-tabs"></div>
    <div class="theme-picker">
      <span id="theme-label" class="theme-label toolbar-text-shadow" textLoc="Theme"></span>
      <mat-form-field class="theme-field">
        <mat-select aria-labelledby="theme-label" [value]="theme()" (valueChange)="updateTheme($event)">
          <mat-select-trigger>
            <div class="theme-option"><span [textLoc]="themeName(theme())"></span></div>
          </mat-select-trigger>
          @for (option of themes; track option) {
            <mat-option [value]="option">
              <div class="theme-option"><span [textLoc]="themeName(option)"></span></div>
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <mat-form-field class="language-field">
      <mat-select [value]="language()" (valueChange)="updateLanguage($event)">
        <mat-select-trigger>
          <div class="lang-option">{{ langDisplayName(language()) }}</div>
        </mat-select-trigger>
        @for (option of langauges; track option) {
          <mat-option [value]="option">
            <div class="lang-option">
              {{ langDisplayName(option) }}
            </div>
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
    <span class="app-version" title="Version {{ version }}">v{{ version }}</span>
  </div>
</mat-toolbar>
